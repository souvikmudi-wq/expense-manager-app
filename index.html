<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Manager</title>
<meta name="description" content="Split trip costs fairly and settle up with UPI.">
<meta name="theme-color" content="#1f5f33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<!-- iPhone / iPad: full-screen app from the home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --bg: #f6f7fb; --ink: #1d2433; --muted: #667085; --brand: #1f5f33; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11151d; --ink: #e6e9ef; --muted: #98a2b3; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); box-sizing: border-box; overflow: hidden; }
  #app { position: fixed; inset: env(safe-area-inset-top) 0 0 0; width: 100%; height: calc(100% - env(safe-area-inset-top)); border: 0; background: var(--bg); }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); z-index: 2; transition: opacity .3s; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  #splash b { font-size: 20px; }
  .bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(127,127,127,.2); overflow: hidden; position: relative; }
  .bar::after { content: ''; position: absolute; left: -40%; width: 40%; height: 100%; border-radius: 4px; background: var(--brand); animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { to { left: 100%; } }
  #splash small { color: var(--muted); }
  #offline { display: none; position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 3; background: #fdecea; color: #8a1c1c; border: 1px solid #f3b4ae; border-radius: 12px; padding: 10px 14px; text-align: center; }
  #offline button { margin-left: 8px; font: inherit; border-radius: 8px; border: 1px solid #c62828; background: #fff; color: #c62828; padding: 4px 10px; }
  .hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="splash"><img src="icons/icon-192.png" alt=""><b>Expense Manager</b><div class="bar"></div><small id="splash-msg">Opening…</small></div>
<iframe id="app" title="Expense Manager"
        allow="clipboard-write; clipboard-read; camera; autoplay; fullscreen; web-share"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="offline">You're offline. Expense Manager needs the internet. <button onclick="location.reload()">Retry</button></div>
<script src="config.js"></script>
<script>
  (function () {
    var base = window.EXPENSE_MANAGER_URL;
    // pass ?group=… through, so shared trip links open the right trip inside the app
    var q = location.search && /[?&]group=/.test(location.search) ? location.search : '';
    var frame = document.getElementById('app'), splash = document.getElementById('splash');
    var done = function () { splash.classList.add('hide'); setTimeout(function () { splash.style.display = 'none'; }, 350); };
    frame.addEventListener('load', function () { setTimeout(done, 400); });
    setTimeout(function () { document.getElementById('splash-msg').textContent = 'Still loading… check your internet connection.'; }, 12000);
    var off = document.getElementById('offline');
    var net = function () { off.style.display = navigator.onLine ? 'none' : 'block'; };
    window.addEventListener('online', function () { net(); if (!frame.src) frame.src = base + q; });
    window.addEventListener('offline', net); net();
    if (navigator.onLine) frame.src = base + q;
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  })();
</script>
</body>
</html>
