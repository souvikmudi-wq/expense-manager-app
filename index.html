<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Manager</title>
<meta name="description" content="Split trip costs fairly and settle up with UPI.">
<meta name="theme-color" content="#1f5f33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<!-- iPhone / iPad: full-screen app from the home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --bg: #f6f7fb; --ink: #1d2433; --muted: #667085; --brand: #1f5f33; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11151d; --ink: #e6e9ef; --muted: #98a2b3; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); box-sizing: border-box; overflow: hidden; }
  #app { position: fixed; inset: env(safe-area-inset-top) 0 0 0; width: 100%; height: calc(100% - env(safe-area-inset-top)); border: 0; background: var(--bg); }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); z-index: 2; transition: opacity .3s; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  #splash b { font-size: 20px; }
  .bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(127,127,127,.2); overflow: hidden; position: relative; }
  .bar::after { content: ''; position: absolute; left: -40%; width: 40%; height: 100%; border-radius: 4px; background: var(--brand); animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { to { left: 100%; } }
  #splash small { color: var(--muted); }
  #offline { display: none; position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 3; background: #fdecea; color: #8a1c1c; border: 1px solid #f3b4ae; border-radius: 12px; padding: 10px 14px; text-align: center; }
  #offline button { margin-left: 8px; font: inherit; border-radius: 8px; border: 1px solid #c62828; background: #fff; color: #c62828; padding: 4px 10px; }
  .hide { opacity: 0; pointer-events: none; }
  #geo-ask { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 4; max-width: 560px; margin: 0 auto;
             background: #fff; color: #1d2433; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.35); padding: 14px 16px; }
  #geo-ask[hidden] { display: none; }
  #geo-ask .gq { display: flex; gap: 12px; align-items: flex-start; } #geo-ask .gi { font-size: 26px; line-height: 1; }
  #geo-ask small { display: block; color: #667085; margin-top: 2px; }
  #geo-ask .gb { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  #geo-ask button { font: inherit; border-radius: 10px; border: 1px solid #d0d5dd; background: #fff; color: #1d2433; padding: 9px 14px; cursor: pointer; }
  #geo-ask button.yes { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 700; }
</style>
</head>
<body>
<div id="splash"><img src="icons/icon-192.png" alt=""><b>Expense Manager</b><div class="bar"></div><small id="splash-msg">Opening…</small></div>
<iframe id="app" title="Expense Manager"
        allow="clipboard-write; clipboard-read; camera; geolocation; autoplay; fullscreen; web-share"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="geo-ask" role="dialog" aria-live="polite" hidden>
  <div class="gq"><span class="gi" aria-hidden="true">📍</span><div><b>Share your location for the route?</b>
    <small>Used only to calculate this route and never saved. Your browser will ask next — choose <b>Allow</b>.</small></div></div>
  <div class="gb"><button id="geo-no" type="button">Not now</button><button id="geo-yes" type="button" class="yes">📍 Share my location</button></div>
</div>
<div id="offline">You're offline. Expense Manager needs the internet. <button onclick="location.reload()">Retry</button></div>
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
<script>
  (function () {
    var base = window.EXPENSE_MANAGER_URL;
    // pass ?group=… through, so shared trip links open the right trip inside the app
    var q = location.search && /[?&]group=/.test(location.search) ? location.search : '';
    var frame = document.getElementById('app'), splash = document.getElementById('splash');
    var done = function () { splash.classList.add('hide'); setTimeout(function () { splash.style.display = 'none'; }, 350); };
    frame.addEventListener('load', function () { setTimeout(done, 400); });
    setTimeout(function () { document.getElementById('splash-msg').textContent = 'Still loading… check your internet connection.'; }, 12000);
    var off = document.getElementById('offline');
    var net = function () { off.style.display = navigator.onLine ? 'none' : 'block'; };
    window.addEventListener('online', function () { net(); if (!frame.src) frame.src = base + q; });
    window.addEventListener('offline', net); net();
    if (navigator.onLine) frame.src = base + q;
    // Keep people signed in: hold a backup of the app's sign-in token (the app asks for it when it starts).
    // Only the Apps Script page (googleusercontent.com) may read or change it.
    var sheet = document.getElementById('geo-ask'), geoReply = null;
    document.getElementById('geo-yes').addEventListener('click', function () {
      if (!geoReply) return (sheet.hidden = true);
      this.disabled = true; var btn = this; btn.textContent = 'Getting location…';
      navigator.geolocation.getCurrentPosition(function (p) { btn.disabled = false; btn.textContent = '📍 Share my location'; if (geoReply) geoReply({ type: 'em-geo-result', ok: true, lat: p.coords.latitude, lon: p.coords.longitude }); },
        function (err) { btn.disabled = false; btn.textContent = '📍 Share my location'; if (geoReply) geoReply({ type: 'em-geo-result', ok: false, code: err && err.code || 0 }); },
        { enableHighAccuracy: false, timeout: 20000, maximumAge: 300000 });
    });
    document.getElementById('geo-no').addEventListener('click', function () { if (geoReply) geoReply({ type: 'em-geo-result', ok: false, code: 'cancel' }); else sheet.hidden = true; });
    var KEY = 'em-token', fromApp = function (o) { return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o); };
    window.addEventListener('message', function (e) {
      if (!fromApp(e.origin) || !e.data) return;
      try {
        if (e.data.type === 'em-hello') e.source.postMessage({ type: 'em-shell', token: localStorage.getItem(KEY) || '' }, e.origin);
        else if (e.data.type === 'em-geo') {          // the app asks for the location (Apps Script pages can't)
          var src = e.source, org = e.origin;
          geoReply = function (m) { geoReply = null; sheet.hidden = true; try { src.postMessage(m, org); } catch (x) {} };
          if (!navigator.geolocation) return geoReply({ type: 'em-geo-result', ok: false, code: 2 });
          sheet.hidden = false; document.getElementById('geo-yes').focus();   // browsers only ask after a tap on THIS page
        }
        else if (e.data.type === 'em-token') { if (e.data.token) localStorage.setItem(KEY, String(e.data.token)); else localStorage.removeItem(KEY); }
      } catch (err) { /* storage blocked – the app still works, people just sign in again */ }
    });
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  })();
</script>
</body>
</html>
